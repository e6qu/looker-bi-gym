id: bi-foundations-exam
title: BI Foundations Practical Exam Cards
mode: self_assessed
estimated_minutes_per_card: 120
description: >
  Untimed independent challenge cards for a data analyst moving into banking BI.
  Cards use synthetic datasets, deterministic expected outputs, and
  self-assessment notes.
cards:
  - id: exam-card-grain-and-fanout
    title: Grain And Fanout Review
    recommended_learner_tasks:
      - LT-BI-001
      - LT-BI-002
    source_facts:
      - FACT-BI-GRAIN-DECLARE-BEFORE-AGGREGATION
      - FACT-BI-FANOUT-JOIN-RISK
      - FACT-BIGQUERY-REDUCE-BEFORE-JOIN
    objective: >
      Produce a one-page review note and SQL result proving that current
      balance reporting stays at latest account-date grain before ownership
      analysis is introduced.
    verification:
      expected_outputs:
        - correct_ledger_total = 95700
        - naive_joined_total = 164800
        - fanout_delta = 69100
      self_assessment: >
        The learner can identify the duplicated measure and explain why the
        repair belongs upstream of dashboard charts.
  - id: exam-card-month-end-controls
    title: Month-End Controls Review
    recommended_learner_tasks:
      - LT-SQL-003
      - LT-DQ-005
    source_facts:
      - FACT-BI-SEMI-ADDITIVE-BALANCE-SNAPSHOT
      - FACT-BI-REFERENCE-DATE-SEPARATION
      - FACT-BI-RECONCILIATION-WINDOWS
    objective: >
      Build a currency-level month-end exposure result and attach controls for
      non-month-end rows, stale collateral valuation, and output minimisation.
    verification:
      expected_outputs:
        - EUR latest_principal_total = 55000
        - RON latest_principal_total = 396000
        - non_month_end_snapshot_count = 1
        - stale_collateral_valuation_count = 3
      self_assessment: >
        The learner can distinguish exposure date, valuation date, and
        dashboard control dates without exposing loan or property identifiers.
