name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate, Test, And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up pnpm
        uses: pnpm/action-setup@v6

      - name: Set Up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Challenge Manifests
        run: pnpm validate:manifests

      - name: Validate Synthetic Datasets
        run: pnpm validate:datasets

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test Quiz Runtime
        run: pnpm test:quiz

      - name: Test SQL Runtime
        run: pnpm test:sql

      - name: Test Solution Fixtures
        run: pnpm test:fixtures

      - name: Test Cloud Evidence Runtime
        run: pnpm test:cloud-evidence

      - name: Test Progress Export
        run: pnpm test:progress-export

      - name: Test Content QA
        run: pnpm test:content-qa

      - name: Test Browser Validators
        run: pnpm test:validators

      - name: Build Static App
        run: pnpm build

      - name: Validate Built Static Links
        run: pnpm validate:static-links
