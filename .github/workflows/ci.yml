name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate, Test, And Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Validate Challenge Manifests
        run: bun run validate:manifests

      - name: Validate Synthetic Datasets
        run: bun run validate:datasets

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test Quiz Runtime
        run: bun run test:quiz

      - name: Test SQL Runtime
        run: bun run test:sql

      - name: Test Solution Fixtures
        run: bun run test:fixtures

      - name: Test Cloud Evidence Runtime
        run: bun run test:cloud-evidence

      - name: Test Progress Export
        run: bun run test:progress-export

      - name: Test Content QA
        run: bun run test:content-qa

      - name: Test Browser Validators
        run: bun run test:validators

      - name: Install Playwright Browser
        run: bunx playwright install --with-deps chromium

      - name: Test Rendered UI
        run: bun run test:e2e

      - name: Build Static App
        run: bun run build

      - name: Validate Built Static Links
        run: bun run validate:static-links
