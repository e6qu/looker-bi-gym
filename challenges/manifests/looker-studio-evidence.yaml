id: looker-studio-evidence
version: v0.2.0
title: 030 - Looker Studio Evidence Pattern
area: looker-studio-and-dashboard-design
mode: cloud-evidence
difficulty: intermediate
estimated_minutes: 35
prerequisites:
  - first-banking-dataset
business_scenario: Practice collecting inspectable evidence from a browser-based synthetic BI workflow without storing credentials in the app.
regulatory_context:
  - BNR
  - GDPR
required_tools:
  - name: Google Cloud Console
    purpose: Optional cloud-applied track for BigQuery UI work in a browser.
    required: false
    platform_notes: Browser UI only; no Google Cloud CLI.
  - name: Looker Studio
    purpose: Optional report-building evidence through the browser UI.
    required: false
    platform_notes: Browser UI only; no service account keys or app-stored credentials.
inputs:
  - id: serving_view_contract
    type: markdown
    description: Tutorial instructions for using a serving view as the dashboard source.
    path: tutorials/data-sources.md
  - id: cloud_ui
    type: cloud-ui
    description: Optional browser UI workflow in BigQuery and Looker Studio.
outputs:
  - id: serving_sql
    type: sql-text
    description: SQL text for the dashboard serving view.
  - id: control_result
    type: dashboard-evidence
    description: Pasted CSV or JSON result from the serving view control query.
  - id: report_url
    type: dashboard-evidence
    description: Looker Studio report URL format evidence.
checks:
  - id: serving_sql_names_view
    type: sql-text-contains
    description: SQL text names the serving view instead of only an ad hoc dashboard source.
    target: serving_sql
    expected:
      - serving_deposit_dashboard
      - account_daily_balances
  - id: pasted_result_columns
    type: tabular-required-columns
    description: Pasted CSV or JSON result includes the expected dashboard control columns.
    target: control_result
    expected:
      - business_date
      - currency_code
      - ledger_total
  - id: dashboard_total_range
    type: numeric-range
    description: Visible dashboard total is in the expected synthetic latest-day range.
    target: visible_total
    expected:
      min: 95000
      max: 96000
  - id: report_url_format
    type: report-url-format
    description: Report URL has a Looker Studio host and uses HTTPS.
    target: report_url
    expected:
      require_https: true
      allowed_hosts:
        - lookerstudio.google.com
        - datastudio.google.com
  - id: manual_dashboard_confirmation
    type: checklist-confirmed
    description: Learner confirms the dashboard visibly labels source freshness and excludes sensitive fields.
    target: dashboard_checklist
    expected: true
questions:
  - id: q_credentials
    type: multiple-choice
    prompt: Under FACT-LOOKER-STUDIO-CREDENTIALS, what should this static app store for the cloud evidence task?
    options:
      - id: no_credentials
        label: No cloud credentials or tokens.
      - id: service_key
        label: A service account key.
      - id: oauth_token
        label: A pasted OAuth access token.
    answer: no_credentials
    explanation: FACT-LOOKER-STUDIO-CREDENTIALS belongs in Looker Studio data-source configuration, while the static app collects only local evidence text.
    source_facts:
      - FACT-LOOKER-STUDIO-CREDENTIALS
  - id: q_calculated_field_scope
    type: multiple-choice
    prompt: According to FACT-LOOKER-STUDIO-CALCULATED-FIELD-SCOPE, where is reusable dashboard metric logic safer than a single-chart field?
    options:
      - id: data_source_or_upstream
        label: In the shared data source or upstream serving view.
      - id: single_chart
        label: Only inside one chart-specific calculated field.
      - id: browser_cookie
        label: In a browser cookie mirrored by the app.
    answer: data_source_or_upstream
    explanation: FACT-LOOKER-STUDIO-CALCULATED-FIELD-SCOPE distinguishes reusable data-source fields from chart-only fields; governed metrics should not hide in one chart.
    source_facts:
      - FACT-LOOKER-STUDIO-CALCULATED-FIELD-SCOPE
      - FACT-BIGQUERY-VIEW-SCOPE
lesson_steps:
  - id: define_serving_view
    title: Define the serving view SQL
    instruction: Paste SQL that creates or selects a serving_deposit_dashboard view using account_daily_balances and returning business_date, currency_code, and ledger_total.
    expected_result: The SQL text contains serving_deposit_dashboard, account_daily_balances, business_date, currency_code, and ledger_total.
    why_it_matters: A logical view is a reusable SQL-defined source for dashboard charts.
    failure_mode: Building charts from ad hoc raw table fields spreads metric logic across the report.
    source_facts:
      - FACT-BIGQUERY-LOGICAL-VIEW
      - FACT-BIGQUERY-VIEW-SCOPE
  - id: check_view_limitations
    title: Check view constraints before treating it as dynamic input
    instruction: Confirm that a BigQuery logical view is read-only, same-location with referenced tables, and cannot use query parameters.
    expected_result: Your evidence note does not rely on runtime view parameters or cross-location source tables.
    why_it_matters: Cloud-applied BI instructions should teach operational constraints, not just happy-path SQL.
    failure_mode: Designing a dashboard that assumes parameterized logical views creates an implementation mismatch.
    source_facts:
      - FACT-BIGQUERY-VIEW-LIMITATIONS
  - id: inspect_looker_data_source
    title: Inspect the Looker Studio data source
    instruction: In the optional browser UI track, connect Looker Studio to the serving view and inspect the data source field schema before building charts.
    expected_result: The data source exposes business_date, currency_code, and ledger_total as the chart field schema.
    why_it_matters: Looker Studio reports consume fields through a data source, so field type and credential checks happen there.
    failure_mode: Dragging charts without inspecting the data source can hide wrong field types or unsafe credentials.
    source_facts:
      - FACT-LOOKER-STUDIO-DATA-SOURCE
      - FACT-LOOKER-STUDIO-CREDENTIALS
  - id: keep_evidence_local
    title: Keep evidence local and credential-free
    instruction: Paste only inspectable SQL, small CSV/JSON control output, a report URL format, and the checklist confirmation; do not paste tokens, keys, credentials, or real banking data.
    expected_result: The app validates local evidence shape and never receives cloud credentials.
    why_it_matters: The static app can verify evidence text without becoming a credential or backend evidence store.
    failure_mode: Pasting service keys or OAuth tokens into a static training app would violate the frontend-only boundary.
    source_facts:
      - FACT-LOOKER-STUDIO-CREDENTIALS
      - FACT-GDPR-SECURITY-PROCESSING
evidence:
  - id: serving_sql
    type: pasted-sql
    label: Serving view SQL
    description: Paste the SQL that creates or selects from the dashboard serving view.
    placeholder: "CREATE OR REPLACE VIEW serving_deposit_dashboard AS ..."
    required: true
  - id: control_result
    type: pasted-result
    label: Pasted control result
    description: Paste CSV or JSON with business_date, currency_code, and ledger_total columns.
    placeholder: "business_date,currency_code,ledger_total\n2026-03-31,RON,79300"
    required: true
  - id: visible_total
    type: numeric-value
    label: Visible latest-day total
    description: Enter the latest-day dashboard total across currencies from the visible report.
    placeholder: "95700"
    required: true
  - id: report_url
    type: report-url
    label: Report URL
    description: Paste the Looker Studio report URL for format validation only.
    placeholder: https://lookerstudio.google.com/reporting/example
    required: true
  - id: dashboard_checklist
    type: checklist-confirmation
    label: Dashboard confirmation
    description: Confirm the report visibly labels source freshness and does not expose account_id, customer_id, or synthetic_iban.
    required: true
    self_attested: true
flag:
  id: flag-looker-studio-evidence
  criteria:
    - SQL, pasted result, numeric evidence, and URL format checks pass locally.
    - Credential storage question is answered correctly.
    - Dashboard freshness and sensitive-field exclusion are self-attested by checklist.
hints:
  - level: 1
    text: Evidence should describe what is visible without pasting secrets, tokens, or private URLs.
  - level: 2
    text: A valid control result can be pasted as CSV or as a JSON array of objects.
