id: orientation-quiz
version: v0.2.0
title: 000 - Orientation Quiz
area: orientation-and-source-data
mode: quiz
difficulty: intro
estimated_minutes: 10
prerequisites: []
business_scenario: Verify the starting BI boundaries before working with synthetic Romanian banking examples.
regulatory_context:
  - BNR
  - FGDB
  - GDPR
required_tools: none
inputs:
  - id: platform_notes
    type: markdown
    description: Orientation material, regulation notes, and synthetic-data guidance available on this site.
    path: docs/README.md
outputs:
  - id: quiz_answers
    type: answer-set
    description: Browser-local answers to orientation and synthetic-data questions.
checks:
  - id: bigquery_view_contract
    type: quiz-answer
    description: Learner identifies BigQuery logical views as SQL-defined virtual tables.
    target: q_bigquery_logical_view
    expected: sql_defined_virtual_table
  - id: looker_data_source_contract
    type: quiz-answer
    description: Learner identifies the role of a Looker Studio data source.
    target: q_looker_data_source
    expected: conduit_schema
  - id: sensitive_fields
    type: quiz-answer
    description: Learner identifies fields that should be excluded from serving outputs under the data minimisation checkpoint.
    target: q_data_minimisation
    expected:
      - account_id
      - customer_id
      - synthetic_iban
  - id: deposit_guarantee_ceiling
    type: quiz-answer
    description: Learner identifies the EU/FGDB standard deposit guarantee ceiling amount.
    target: q_deposit_guarantee_amount
    expected: 100000
lesson_steps:
  - id: identify_bigquery_view_contract
    title: Verify the serving-view contract
    instruction: Choose the BigQuery object that would keep tested SQL reusable for a dashboard source.
    expected_result: You choose the SQL-defined virtual table, not a spreadsheet or mutable dashboard staging table.
    why_it_matters: Banking BI dashboards need governed serving models before charts reuse the metrics.
    failure_mode: Treating a chart calculation as the governed source duplicates metric logic across reports.
    source_facts:
      - FACT-BIGQUERY-LOGICAL-VIEW
      - FACT-BIGQUERY-VIEW-SCOPE
  - id: identify_looker_data_source
    title: Verify the Looker Studio source layer
    instruction: Choose the layer a reviewer should inspect before trusting chart fields and aggregation behavior.
    expected_result: You choose the data source as the conduit and schema layer between external data and charts.
    why_it_matters: Banking dashboards should inspect field definitions, aggregation defaults, and credentials before chart building.
    failure_mode: Building directly from fields without checking the data source can hide wrong aggregation or access behavior.
    source_facts:
      - FACT-LOOKER-STUDIO-DATA-SOURCE
      - FACT-LOOKER-STUDIO-DIMENSIONS-METRICS
  - id: apply_data_minimisation
    title: Verify data minimisation in an output field list
    instruction: Select the fields that should not appear in a routine branch-level dashboard source.
    expected_result: You select account_id, customer_id, and synthetic_iban.
    why_it_matters: GDPR data minimisation is the fact-backed reason to reject unnecessary identifiers in dashboard-ready results.
    failure_mode: Exposing raw identifiers because the data is synthetic trains the wrong production habit.
    source_facts:
      - FACT-GDPR-PERSONAL-DATA
      - FACT-GDPR-DATA-MINIMISATION
  - id: identify_deposit_ceiling
    title: Verify the guarantee reference amount
    instruction: Enter the standard EUR amount a dashboard note should use before later depositor-bank grain exercises.
    expected_result: You enter 100000.
    why_it_matters: Deposit-guarantee exercises need depositor-bank grain and precise amount/currency wording.
    failure_mode: Confusing account balance totals with depositor-bank compensation coverage creates wrong BI semantics.
    source_facts:
      - FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK
      - FACT-DGSD-100K-EU
questions:
  - id: q_bigquery_logical_view
    type: multiple-choice
    prompt: A BI team needs one governed BigQuery object that stores tested SQL and can be queried by dashboards like a table. Which object fits that need?
    options:
      - id: sql_defined_virtual_table
        label: A virtual table defined by a SQL query.
      - id: uploaded_spreadsheet
        label: A spreadsheet uploaded into Looker Studio.
      - id: mutable_staging_table
        label: A mutable staging table updated by dashboard users.
    answer: sql_defined_virtual_table
    explanation: A BigQuery logical view is a virtual table defined by SQL, which makes it useful for reusable serving-layer logic.
    source_facts:
      - FACT-BIGQUERY-LOGICAL-VIEW
  - id: q_looker_data_source
    type: multiple-choice
    prompt: Before trusting a Looker Studio report, which layer should a BI reviewer inspect for fields, aggregation behavior, and connection settings?
    options:
      - id: conduit_schema
        label: It connects external data to charts and provides the report field schema.
      - id: browser_cache
        label: It stores each viewer's dashboard click history as metric data.
      - id: legal_opinion
        label: It determines whether a banking dashboard is compliant.
    answer: conduit_schema
    explanation: The data source is the conduit and schema layer that report charts use.
    source_facts:
      - FACT-LOOKER-STUDIO-DATA-SOURCE
  - id: q_data_minimisation
    type: select-all
    prompt: A branch-level balance dashboard source is being prepared for routine review. Which fields should be removed unless there is a specific approved purpose?
    options:
      - id: account_id
        label: account_id
      - id: branch_city
        label: branch_city
      - id: customer_id
        label: customer_id
      - id: synthetic_iban
        label: synthetic_iban
    answer:
      - account_id
      - customer_id
      - synthetic_iban
    explanation: Unnecessary account, customer, and synthetic IBAN identifiers should stay out of serving outputs for this dashboard purpose.
    source_facts:
      - FACT-GDPR-PERSONAL-DATA
      - FACT-GDPR-DATA-MINIMISATION
  - id: q_deposit_guarantee_amount
    type: numeric
    prompt: A dashboard annotation references the standard EU deposit-guarantee ceiling before any legal review. What harmonised EUR amount applies per depositor per credit institution?
    answer: 100000
    tolerance: 0
    explanation: The harmonised EU deposit-guarantee coverage ceiling is EUR 100,000 per depositor per credit institution.
    source_facts:
      - FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK
      - FACT-DGSD-100K-EU
flag:
  id: flag-orientation-quiz
  criteria:
    - Answer all orientation questions correctly.
hints:
  - level: 1
    text: Check the synthetic-data and browser-first constraints shown on the home page.
next_challenges:
  - first-banking-dataset
