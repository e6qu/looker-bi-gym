id: orientation-quiz
version: v0.2.0
title: 000 - Orientation Quiz
area: orientation-and-source-data
mode: quiz
difficulty: intro
estimated_minutes: 10
prerequisites: []
business_scenario: Confirm the training boundary before working with synthetic Romanian banking BI examples.
regulatory_context:
  - BNR
  - FGDB
  - GDPR
required_tools: none
inputs:
  - id: platform_notes
    type: markdown
    description: Existing docs, regulations, and tutorials rendered in the static app.
    path: docs/README.md
outputs:
  - id: quiz_answers
    type: answer-set
    description: Browser-local answers to orientation and synthetic-data questions.
checks:
  - id: browser_sql_runtime
    type: quiz-answer
    description: Learner confirms DuckDB-WASM runs SQL locally in the browser.
    target: q_duckdb_wasm
    expected: browser_wasm
  - id: progress_storage
    type: quiz-answer
    description: Learner identifies browser-local progress storage behavior.
    target: q_progress_storage
    expected: local_origin_storage
  - id: sensitive_fields
    type: quiz-answer
    description: Learner identifies fields that should be excluded from serving outputs under the data minimisation checkpoint.
    target: q_data_minimisation
    expected:
      - account_id
      - customer_id
      - synthetic_iban
  - id: deposit_guarantee_ceiling
    type: quiz-answer
    description: Learner identifies the EU/FGDB standard deposit guarantee ceiling amount.
    target: q_deposit_guarantee_amount
    expected: 100000
lesson_steps:
  - id: open_runtime_boundary
    title: Confirm where SQL runs
    instruction: Open the challenge page and read the browser SQL runtime note before answering; the learner path uses DuckDB-WASM in the browser, not a backend grading service.
    expected_result: You can state that challenge SQL runs locally against small synthetic CSV data.
    why_it_matters: A frontend-only BI training app must not imply that learner answers or datasets are uploaded to a server.
    failure_mode: Assuming there is hidden server-side grading would hide the privacy and reproducibility boundary.
    source_facts:
      - FACT-DUCKDB-WASM-BROWSER
  - id: inspect_progress_storage
    title: Confirm progress storage
    instruction: Open Settings after a challenge attempt and inspect the local progress preview; progress is kept in browser storage and mirrored to a same-site cookie fallback.
    expected_result: Progress is visible only in this browser origin until reset or cleared by the learner.
    why_it_matters: The static app has no backend account, server session, or analytics upload path.
    failure_mode: Treating the cookie as a server session would misstate the architecture.
    source_facts:
      - FACT-WEB-LOCALSTORAGE-PERSISTENCE
      - FACT-WEB-COOKIE-SYNC
  - id: apply_data_minimisation
    title: Apply data minimisation to outputs
    instruction: Review the seed dataset sensitive fields and choose which raw identifiers do not belong in BI serving outputs.
    expected_result: The selected fields are account_id, customer_id, and synthetic_iban.
    why_it_matters: GDPR data minimisation is the fact-backed reason to reject unnecessary identifiers in dashboard-ready results.
    failure_mode: Exposing raw identifiers because the data is synthetic trains the wrong production habit.
    source_facts:
      - FACT-GDPR-PERSONAL-DATA
      - FACT-GDPR-DATA-MINIMISATION
  - id: identify_deposit_ceiling
    title: Identify the deposit guarantee ceiling
    instruction: Use the FGDB/EU source facts to answer the standard deposit guarantee amount before later depositor-bank grain exercises.
    expected_result: The standard ceiling is EUR 100,000.
    why_it_matters: Deposit-guarantee exercises need depositor-bank grain and precise amount/currency wording.
    failure_mode: Confusing account balance totals with depositor-bank compensation coverage creates wrong BI semantics.
    source_facts:
      - FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK
      - FACT-DGSD-100K-EU
questions:
  - id: q_duckdb_wasm
    type: multiple-choice
    prompt: According to FACT-DUCKDB-WASM-BROWSER, where does this app run browser SQL challenge queries?
    options:
      - id: browser_wasm
        label: In the learner browser through DuckDB compiled to WebAssembly.
      - id: backend_database
        label: In a server-side training database controlled by the app.
      - id: cloud_cli
        label: In the Google Cloud CLI installed on the learner machine.
    answer: browser_wasm
    explanation: FACT-DUCKDB-WASM-BROWSER anchors the local runtime boundary; SQL validation is browser-local over small synthetic data.
    source_facts:
      - FACT-DUCKDB-WASM-BROWSER
  - id: q_progress_storage
    type: multiple-choice
    prompt: Which progress statement matches FACT-WEB-LOCALSTORAGE-PERSISTENCE and FACT-WEB-COOKIE-SYNC?
    options:
      - id: local_origin_storage
        label: Progress stays in browser-local origin storage with a same-site cookie fallback.
      - id: server_session
        label: Progress is recovered from a backend session when the learner signs in.
      - id: analytics_profile
        label: Progress is reconstructed from analytics events sent by the app.
    answer: local_origin_storage
    explanation: FACT-WEB-LOCALSTORAGE-PERSISTENCE and FACT-WEB-COOKIE-SYNC describe local browser storage surfaces, not backend sessions.
    source_facts:
      - FACT-WEB-LOCALSTORAGE-PERSISTENCE
      - FACT-WEB-COOKIE-SYNC
  - id: q_data_minimisation
    type: select-all
    prompt: Under FACT-GDPR-DATA-MINIMISATION, which seed fields should be excluded from a dashboard serving output unless there is a specific purpose?
    options:
      - id: account_id
        label: account_id
      - id: branch_city
        label: branch_city
      - id: customer_id
        label: customer_id
      - id: synthetic_iban
        label: synthetic_iban
    answer:
      - account_id
      - customer_id
      - synthetic_iban
    explanation: FACT-GDPR-DATA-MINIMISATION is the reason to keep unnecessary account, customer, and synthetic IBAN identifiers out of serving outputs.
    source_facts:
      - FACT-GDPR-PERSONAL-DATA
      - FACT-GDPR-DATA-MINIMISATION
  - id: q_deposit_guarantee_amount
    type: numeric
    prompt: According to FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK and FACT-DGSD-100K-EU, what is the standard deposit guarantee ceiling amount in EUR?
    answer: 100000
    tolerance: 0
    explanation: FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK and FACT-DGSD-100K-EU both anchor the EUR 100,000 ceiling used in later grain exercises.
    source_facts:
      - FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK
      - FACT-DGSD-100K-EU
flag:
  id: flag-orientation-quiz
  criteria:
    - Answer all orientation questions correctly.
hints:
  - level: 1
    text: Check the project constraints shown on the home page.
next_challenges:
  - first-banking-dataset
