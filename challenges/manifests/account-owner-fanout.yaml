id: account-owner-fanout
version: v0.2.0
title: 020 - Account Owner Fanout CTF
area: warehouse-modeling-and-metrics
mode: browser-sql
difficulty: beginner
estimated_minutes: 30
prerequisites:
  - first-banking-dataset
business_scenario: Prove how a naive balance-to-owner join overstates latest synthetic deposit balances, then return a reconciled one-row result that keeps account-date grain intact.
regulatory_context:
  - BNR
  - FGDB
  - GDPR
required_tools: none
inputs:
  - id: deposits_seed
    type: dataset
    description: Static synthetic deposits dataset with daily balance snapshots and many-to-many account ownership rows.
    dataset_id: deposits-seed
    dataset_version: v0.1.0
    tables:
      - accounts
      - account_owners
      - account_daily_balances
    sensitive_fields:
      - customer_id
      - account_id
      - synthetic_iban
    date_semantics:
      - business_date is a daily balance snapshot date.
      - Use the latest available business_date for the fanout proof.
    grain: The safe metric grain is one row per account on the latest business_date before joining or summarizing owner relationships.
outputs:
  - id: fanout_query
    type: sql-text
    description: SQL that compares correct account-grain balance totals with naive owner-joined totals.
  - id: fanout_result
    type: sql-result
    description: One-row result showing the latest date, correct total, naive total, fanout delta, and percentage overstatement.
checks:
  - id: required_columns
    type: required-column
    description: Result includes the fanout proof columns.
    target: fanout_result
    expected:
      - latest_balance_date
      - correct_ledger_total
      - naive_joined_total
      - fanout_delta
      - overstatement_pct
  - id: no_sensitive_fields
    type: sensitive-field-exclusion
    description: Result must not expose sensitive serving-output fields.
    target: fanout_result
    expected:
      - customer_id
      - account_id
      - synthetic_iban
  - id: one_fanout_row
    type: row-count
    description: Result returns exactly one fanout proof row.
    target: fanout_result
    expected: 1
  - id: unique_latest_date
    type: unique-key
    description: Result has one unique latest balance date.
    target: fanout_result
    expected:
      - latest_balance_date
  - id: correct_latest_total
    type: scalar-aggregate
    description: Correct latest-date ledger balance total stays at account grain.
    target: fanout_result
    expected:
      column: correct_ledger_total
      value: 95700
      tolerance: 0
  - id: naive_join_total
    type: scalar-aggregate
    description: Naive owner-joined total demonstrates the fanout overstatement.
    target: fanout_result
    expected:
      column: naive_joined_total
      value: 164800
      tolerance: 0
  - id: fanout_delta
    type: scalar-aggregate
    description: Fanout delta reconciles the naive total back to the correct total.
    target: fanout_result
    expected:
      column: fanout_delta
      value: 69100
      tolerance: 0
  - id: overstatement_pct
    type: scalar-aggregate
    description: Fanout percentage is rounded to two decimals.
    target: fanout_result
    expected:
      column: overstatement_pct
      value: 72.2
      tolerance: 0.01
questions:
  - id: q_safe_grain
    type: multiple-choice
    prompt: Which grain should the correct latest balance total preserve before owner analysis?
    options:
      - id: account_latest_date
        label: One row per account on the latest business date.
      - id: owner_latest_date
        label: One row per account owner on the latest business date.
      - id: branch_all_dates
        label: One row per branch across all dates.
    answer: account_latest_date
    explanation: FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK is why ownership analysis must be deliberate; balance snapshots must first stay at account-latest-date grain.
    source_facts:
      - FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK
  - id: q_delta
    type: numeric
    prompt: How many RON/EUR ledger units does the naive owner join overstate on the latest date?
    answer: 69100
    tolerance: 0
    explanation: FACT-DUCKDB-WASM-BROWSER lets the app verify this locally; the latest-date correct total is 95700 and the naive owner-joined total is 164800.
    source_facts:
      - FACT-DUCKDB-WASM-BROWSER
  - id: q_deposit_guarantee_grain
    type: multiple-choice
    prompt: Which grain does FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK imply for a future deposit-guarantee coverage metric?
    options:
      - id: depositor_bank
        label: One depositor per bank, after resolving ownership.
      - id: account_balance
        label: One account balance row per business date.
      - id: owner_joined_balance
        label: One row per account-owner join result.
    answer: depositor_bank
    explanation: FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK says the ceiling is per depositor per bank, so account-owner join rows are not the final coverage grain.
    source_facts:
      - FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK
lesson_steps:
  - id: run_naive_join
    title: Run the naive owner join mentally before trusting it
    instruction: Inspect account_owners and account_daily_balances, then compare the owner-joined total with the account-grain total in one SQL result.
    expected_result: The naive owner-joined total is 164800 while the correct latest account-grain total is 95700.
    why_it_matters: Many-to-many ownership rows can multiply semi-additive balance facts.
    failure_mode: Summing ledger_balance after joining account_owners treats each owner row as another balance.
    source_facts:
      - FACT-DUCKDB-WASM-BROWSER
  - id: preserve_latest_account_grain
    title: Preserve latest account-date grain first
    instruction: Filter account_daily_balances to the latest business_date and calculate the correct total before joining ownership rows.
    expected_result: correct_ledger_total remains 95700.
    why_it_matters: Snapshot balances are safe to sum across accounts for one date, not after a join that changes row count.
    failure_mode: Grouping after the owner join hides the duplication inside plausible-looking totals.
    source_facts:
      - FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK
  - id: reconcile_fanout_delta
    title: Reconcile the fanout delta
    instruction: Return latest_balance_date, correct_ledger_total, naive_joined_total, fanout_delta, and overstatement_pct in one row.
    expected_result: fanout_delta is 69100 and overstatement_pct is 72.20.
    why_it_matters: A CTF-style proof should show both the wrong number and the reconciled correct number.
    failure_mode: Reporting only the corrected total misses the teachable evidence of how the error happened.
    source_facts:
      - FACT-DUCKDB-WASM-BROWSER
  - id: connect_to_serving_views
    title: Connect the fix to serving-view design
    instruction: Note that a dashboard should consume a curated serving view after grain-safe logic is defined upstream.
    expected_result: Your fix can be described as a serving-view rule, not a one-off chart calculation.
    why_it_matters: BigQuery logical views can centralize reusable SQL for dashboard sources.
    failure_mode: Fixing the total only in a chart leaves the same join trap available to the next report.
    source_facts:
      - FACT-BIGQUERY-LOGICAL-VIEW
      - FACT-BIGQUERY-VIEW-SCOPE
flag:
  id: flag-account-owner-fanout
  criteria:
    - SQL checks prove both the correct account-grain total and the naive owner-joined overstatement.
    - Fanout questions are answered correctly.
hints:
  - level: 1
    text: Filter account_daily_balances to the latest business_date before calculating either total.
  - level: 2
    text: Calculate the correct total without account_owners, then calculate the naive total with account_owners and compare them in one final row.
next_challenges:
  - looker-studio-evidence
