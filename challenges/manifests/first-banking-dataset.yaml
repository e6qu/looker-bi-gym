id: first-banking-dataset
version: v0.1.0
title: 010 - First Banking Dataset Inspection
area: orientation-and-source-data
mode: browser-sql
difficulty: beginner
estimated_minutes: 25
prerequisites:
  - orientation-quiz
business_scenario: Inspect row counts, currencies, branch keys, and snapshot dates in the synthetic deposits seed before building governed BI metrics.
regulatory_context:
  - BNR
  - FGDB
  - GDPR
required_tools: none
inputs:
  - id: deposits_seed
    type: dataset
    description: Static deposits dataset with Romanian branch geography, RON and EUR balances, and ownership rows.
    dataset_id: deposits-seed
    dataset_version: v0.1.0
    tables:
      - branches
      - accounts
      - account_owners
      - account_daily_balances
    sensitive_fields:
      - customer_id
      - account_id
      - synthetic_iban
    date_semantics:
      - balance_date is a daily snapshot date.
      - opened_date is an account lifecycle date.
    grain: One row per account per business_date in account_daily_balances.
outputs:
  - id: profile_query
    type: sql-text
    description: SQL that profiles rows, currencies, branches, and snapshot dates.
  - id: profile_result
    type: sql-result
    description: One-row profile result with row count, currency count, branch count, and latest balance date.
checks:
  - id: required_columns
    type: required-column
    description: Result includes expected profiling columns.
    target: profile_result
    expected:
      - row_count
      - currency_count
      - branch_count
      - latest_balance_date
  - id: no_sensitive_fields
    type: sensitive-field-exclusion
    description: Result must not expose sensitive serving-output fields.
    target: profile_result
    expected:
      - customer_id
      - account_id
      - synthetic_iban
  - id: no_raw_identifiers
    type: forbidden-column
    description: Result must not expose raw account identifiers.
    target: profile_result
    expected:
      - account_id
  - id: one_profile_row
    type: row-count
    description: Result returns one profiling row.
    target: profile_result
    expected: 1
  - id: unique_profile_date
    type: unique-key
    description: Result has one unique latest balance date.
    target: profile_result
    expected:
      - latest_balance_date
  - id: balance_row_total
    type: scalar-aggregate
    description: Result row count matches the seed daily balance rows.
    target: profile_result
    expected:
      column: row_count
      value: 18
      tolerance: 0
questions:
  - id: q_balance_grain
    type: multiple-choice
    prompt: What is the intended grain of the account_daily_balances table?
    options:
      - id: account_day
        label: One row per account per balance date.
      - id: customer_day
        label: One row per customer per balance date.
      - id: branch_month
        label: One row per branch per month.
    answer: account_day
    explanation: Daily balances are semi-additive snapshots at account-date grain.
flag:
  id: flag-first-banking-dataset
  criteria:
    - SQL checks pass for required columns and forbidden sensitive fields.
    - Grain question is answered correctly.
hints:
  - level: 1
    text: Start by counting rows and distinct values without joining ownership rows.
next_challenges:
  - account-owner-fanout
