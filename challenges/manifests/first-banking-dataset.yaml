id: first-banking-dataset
version: v0.2.0
title: 010 - First Banking Dataset Inspection
area: orientation-and-source-data
mode: browser-sql
difficulty: beginner
estimated_minutes: 25
prerequisites:
  - orientation-quiz
business_scenario: Inspect row counts, currencies, branch keys, and snapshot dates in the synthetic deposits seed before building governed BI metrics.
regulatory_context:
  - BNR
  - FGDB
  - GDPR
required_tools: none
inputs:
  - id: deposits_seed
    type: dataset
    description: Static deposits dataset with Romanian branch geography, RON and EUR balances, and ownership rows.
    dataset_id: deposits-seed
    dataset_version: v0.1.0
    tables:
      - branches
      - accounts
      - account_owners
      - account_daily_balances
    sensitive_fields:
      - customer_id
      - account_id
      - synthetic_iban
    date_semantics:
      - balance_date is a daily snapshot date.
      - opened_date is an account lifecycle date.
    grain: One row per account per business_date in account_daily_balances.
outputs:
  - id: profile_query
    type: sql-text
    description: SQL that profiles rows, currencies, branches, and snapshot dates.
  - id: profile_result
    type: sql-result
    description: One-row profile result with row count, currency count, branch count, and latest balance date.
checks:
  - id: required_columns
    type: required-column
    description: Result includes expected profiling columns.
    target: profile_result
    expected:
      - row_count
      - currency_count
      - branch_count
      - latest_balance_date
  - id: no_sensitive_fields
    type: sensitive-field-exclusion
    description: Result must not expose sensitive serving-output fields.
    target: profile_result
    expected:
      - customer_id
      - account_id
      - synthetic_iban
  - id: no_raw_identifiers
    type: forbidden-column
    description: Result must not expose raw account identifiers.
    target: profile_result
    expected:
      - account_id
  - id: one_profile_row
    type: row-count
    description: Result returns one profiling row.
    target: profile_result
    expected: 1
  - id: unique_profile_date
    type: unique-key
    description: Result has one unique latest balance date.
    target: profile_result
    expected:
      - latest_balance_date
  - id: balance_row_total
    type: scalar-aggregate
    description: Result row count matches the seed daily balance rows.
    target: profile_result
    expected:
      column: row_count
      value: 18
      tolerance: 0
questions:
  - id: q_balance_grain
    type: multiple-choice
    prompt: After running the profile query, what grain must be preserved for account_daily_balances before producing a one-row BI profile?
    options:
      - id: account_day
        label: One row per account per balance date.
      - id: customer_day
        label: One row per customer per balance date.
      - id: branch_month
        label: One row per branch per month.
    answer: account_day
    explanation: FACT-BI-GRAIN-DECLARE-BEFORE-AGGREGATION is why the profile must first preserve the account-date snapshot grain before totals are trusted.
    source_facts:
      - FACT-BI-GRAIN-DECLARE-BEFORE-AGGREGATION
  - id: q_profile_output_minimisation
    type: select-all
    prompt: Which raw identifiers should stay out of the one-row profile result under FACT-GDPR-DATA-MINIMISATION?
    options:
      - id: account_id
        label: account_id
      - id: customer_id
        label: customer_id
      - id: branch_count
        label: branch_count
      - id: synthetic_iban
        label: synthetic_iban
    answer:
      - account_id
      - customer_id
      - synthetic_iban
    explanation: FACT-GDPR-DATA-MINIMISATION makes branch_count acceptable for the profile, while unnecessary account/customer/IBAN identifiers stay out.
    source_facts:
      - FACT-GDPR-PERSONAL-DATA
      - FACT-GDPR-DATA-MINIMISATION
lesson_steps:
  - id: inspect_schema
    title: Inspect the loaded synthetic tables
    instruction: Open the challenge and read the schema cards for branches, accounts, account_owners, and account_daily_balances before running SQL.
    expected_result: You can identify account_daily_balances as the balance snapshot table and account_owners as the many-to-many ownership table.
    why_it_matters: Knowing table purpose before joining prevents accidental grain changes in BI metrics.
    failure_mode: Starting with an ownership join makes the profile look richer but can multiply balances later.
    source_facts:
      - FACT-BI-GRAIN-DECLARE-BEFORE-AGGREGATION
  - id: run_profile_query
    title: Run the one-row profile query
    instruction: Run the starter SQL and confirm it returns row_count, currency_count, branch_count, and latest_balance_date.
    expected_result: The result has one row, row_count 18, two currencies, three branches, and the latest balance date.
    why_it_matters: A one-row profile creates a control point before any dashboard or serving-view work.
    failure_mode: Grouping by account_id returns many rows and leaks a sensitive identifier.
    source_facts:
      - FACT-BI-GRAIN-DECLARE-BEFORE-AGGREGATION
      - FACT-GDPR-DATA-MINIMISATION
  - id: confirm_minimised_output
    title: Confirm the output is minimised
    instruction: Check that the result columns do not include account_id, customer_id, or synthetic_iban.
    expected_result: Only aggregate/profile columns appear in the output.
    why_it_matters: BI serving outputs should include only fields needed for the stated purpose.
    failure_mode: Including raw IDs in a dashboard profile creates unnecessary re-identification habits.
    source_facts:
      - FACT-GDPR-PERSONAL-DATA
      - FACT-GDPR-DATA-MINIMISATION
  - id: record_deposit_context
    title: Record the depositor-bank grain warning
    instruction: Note that deposit-guarantee coverage is a depositor-bank concept and is not the same as this account-date balance profile.
    expected_result: Your notes distinguish account-date balance grain from depositor-bank guarantee grain.
    why_it_matters: Later exercises need this distinction to avoid using account totals as guarantee coverage.
    failure_mode: Treating every account balance as a separate guaranteed depositor balance overstates coverage semantics.
    source_facts:
      - FACT-FGDB-100K-PER-DEPOSITOR-PER-BANK
flag:
  id: flag-first-banking-dataset
  criteria:
    - SQL checks pass for required columns and forbidden sensitive fields.
    - Grain question is answered correctly.
hints:
  - level: 1
    text: Start by counting rows and distinct values without joining ownership rows.
next_challenges:
  - account-owner-fanout
